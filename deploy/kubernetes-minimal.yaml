# Bare-minimum Sendora on Kubernetes for a first try (docs/quickstart-kubernetes.md).
# For production use deploy/kubernetes.yaml and docs/kubernetes.md instead.
#
#   kubectl create namespace sendora
#   kubectl -n sendora create secret generic sendora-db-key --from-file=database.key=./database.key
#   kubectl apply -f deploy/kubernetes-minimal.yaml
#   kubectl -n sendora logs deploy/sendora | grep "setup code"
#   kubectl -n sendora port-forward svc/sendora 8080:80     # then open http://localhost:8080
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sendora-data
  namespace: sendora
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sendora
  namespace: sendora
spec:
  replicas: 1 # never more: Sendora is a single-instance application
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: sendora }
  template:
    metadata:
      labels: { app: sendora }
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      # Quick-start convenience: make the volume owned by the app user. The full
      # manifest leaves this to the storage administrator instead of running as root.
      initContainers:
        - name: volume-owner
          image: busybox:1.36.1
          command: ["sh", "-c", "chown 10001:10001 /data && chmod 700 /data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - { name: data, mountPath: /data }
      containers:
        - name: sendora
          image: ghcr.io/mhenderik/sendora:0.9.0
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: SENDORA_DB_KEY_FILE, value: /run/secrets/sendora/database.key }
            # "true" only for the first start of a new, empty volume; set it to
            # "false" afterwards (see the quick start).
            - { name: SENDORA_DB_INITIALIZE, value: "true" }
            - { name: APP_URL, value: "http://localhost:8080" }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: database-key, mountPath: /run/secrets/sendora, readOnly: true }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: sendora-data }
        - name: database-key
          secret:
            secretName: sendora-db-key
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: sendora
  namespace: sendora
spec:
  selector: { app: sendora }
  ports:
    - { name: http, port: 80, targetPort: http }
