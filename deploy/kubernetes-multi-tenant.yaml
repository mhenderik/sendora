# Multi-tenant Sendora on Kubernetes (docs/MULTI-TENANT.md): one process serves
# <slug>.sendora.example.com for every tenant and the platform console on
# admin.sendora.example.com. Replace sendora.example.com everywhere.
#
#   kubectl create namespace sendora
#   kubectl -n sendora create secret generic sendora-db-key --from-file=database.key=./database.key
#   kubectl -n sendora create secret generic sendora-platform-smtp --from-literal=password='...'
#   # replace the ingress-controller namespace placeholder in the NetworkPolicy first
#   kubectl apply -f deploy/kubernetes-multi-tenant.yaml
#   kubectl -n sendora logs deploy/sendora | grep "platform console setup code"
#   # open https://admin.sendora.example.com, create the first platform administrator
#
# DNS: *.sendora.example.com (wildcard) -> the ingress controller.
# TLS: a wildcard certificate needs a DNS-01 challenge (cert-manager below).
# The master key encrypts nothing directly: every tenant's database key is
# derived from it. Keep a protected recovery copy; losing it loses all tenants.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sendora-config
  namespace: sendora
data:
  SENDORA_MULTI_TENANT: "true"
  SENDORA_BASE_DOMAIN: sendora.example.com
  # The ingress controller's pod network: X-Forwarded-For/-Proto/-Host are
  # believed only from these addresses.
  SENDORA_TRUSTED_PROXIES: 10.0.0.0/8
  # Platform settings (read-only in the console while set here).
  SENDORA_TENANT_IDLE_MINUTES: "15"
  SENDORA_MAX_OPEN_TENANTS: "50"
  SENDORA_TENANT_MAINTENANCE_HOURS: "6"
  # Default SMTP server for tenants without their own (welcome and reset mails).
  SENDORA_PLATFORM_SMTP_HOST: smtp.example.com
  SENDORA_PLATFORM_SMTP_PORT: "587"
  SENDORA_PLATFORM_SMTP_USER: sendora@example.com
  SENDORA_PLATFORM_SMTP_FROM: "Sendora <sendora@example.com>"
  SENDORA_PLATFORM_SMTP_TLS: starttls
  SENDORA_PLATFORM_SMTP_PASSWORD_FILE: /run/secrets/sendora-smtp/password
  # Platform administrators must use an authenticator app (default "true").
  # SENDORA_PLATFORM_MFA_REQUIRED: "true"
  # Platform default object storage (docs/STORAGE.md); tenants on the default
  # write under <prefix>tenants/<tenant id>/. Default: local tenant directories.
  # SENDORA_PLATFORM_STORAGE_BACKEND: s3
  # SENDORA_PLATFORM_STORAGE_S3_REGION: eu-central-1
  # SENDORA_PLATFORM_STORAGE_S3_BUCKET: sendora-tenants
  # SENDORA_PLATFORM_STORAGE_S3_PREFIX: ""
  # SENDORA_PLATFORM_STORAGE_S3_AUTH: default   # IRSA / EKS Pod Identity, or static with keys below
  # SENDORA_PLATFORM_STORAGE_S3_ACCESS_KEY: AKIA...
  # SENDORA_PLATFORM_STORAGE_S3_SECRET_KEY_FILE: /run/secrets/sendora-s3/secret-key
  # Platform-wide policy for every tenant (optional), e.g.:
  # SENDORA_MFA_POLICY: required
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sendora-data
  namespace: sendora
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Gi # all tenants: platform.db + tenants/<id>/ (databases, files, backups)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sendora
  namespace: sendora
spec:
  replicas: 1 # never more: one process serves all tenants (SQLite, one volume)
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: sendora }
  template:
    metadata:
      labels: { app: sendora }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sendora
          image: ghcr.io/mhenderik/sendora:0.2.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 4Gi }
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: sendora-config }
          env:
            - { name: SENDORA_DB_KEY_FILE, value: /run/secrets/sendora/database.key }
            # "true" only for the very first start (creates platform.db).
            - { name: SENDORA_DB_INITIALIZE, value: "false" }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: database-key, mountPath: /run/secrets/sendora, readOnly: true }
            - { name: smtp, mountPath: /run/secrets/sendora-smtp, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: sendora-data }
        - name: database-key
          secret: { secretName: sendora-db-key, defaultMode: 0440 }
        - name: smtp
          secret: { secretName: sendora-platform-smtp, defaultMode: 0440 }
        - name: tmp
          emptyDir: { sizeLimit: 4Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: sendora
  namespace: sendora
spec:
  selector: { app: sendora }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Wildcard certificate (DNS-01). Custom domains of tenants need their own
# certificate and an Ingress rule (HTTP-01 works for those).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sendora-wildcard
  namespace: sendora
spec:
  secretName: sendora-wildcard-tls
  dnsNames:
    - sendora.example.com
    - "*.sendora.example.com"
  issuerRef:
    name: letsencrypt-dns01 # a ClusterIssuer with a DNS-01 solver for your DNS provider
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sendora
  namespace: sendora
  annotations:
    # Large uploads are sent in chunks; keep the body limit above the chunk size.
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["*.sendora.example.com"]
      secretName: sendora-wildcard-tls
  rules:
    # One wildcard rule serves every tenant and admin.sendora.example.com;
    # Sendora routes by the Host header (unknown hosts get a plain 404).
    - host: "*.sendora.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: sendora, port: { name: http } }
    # A tenant's verified custom domain (add one rule and certificate per domain):
    # - host: files.customer.example
    #   http: { paths: [ { path: /, pathType: Prefix, backend: { service: { name: sendora, port: { name: http } } } } ] }
---
# Deny all traffic in the namespace by default; the policy below opens only
# what Sendora needs. NetworkPolicies need a CNI that enforces them (Calico,
# Cilium, ...).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: sendora
  labels:
    app.kubernetes.io/name: sendora
    app.kubernetes.io/part-of: sendora
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sendora
  namespace: sendora
  labels:
    app.kubernetes.io/name: sendora
    app.kubernetes.io/instance: sendora
    app.kubernetes.io/part-of: sendora
spec:
  podSelector:
    matchLabels:
      app: sendora
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the ingress controller (or Gateway API implementation) reaches
    # Sendora, for every tenant host and admin.<base domain>. kubelet probes and
    # kubectl port-forward are not affected on common CNIs. Cilium's built-in
    # Ingress/Gateway sends from a reserved identity instead of a namespace: use
    # a CiliumNetworkPolicy (fromEntities: ingress) in that case.
    - from:
        - namespaceSelector:
            matchLabels:
              # >>> PLACEHOLDER: the namespace of YOUR ingress controller or gateway <<<
              kubernetes.io/metadata.name: ingress-controller-namespace
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS through the cluster DNS (CoreDNS keeps the k8s-app: kube-dns label);
    # also used for the TXT lookups that verify tenants' custom domains.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS: tenants' sign-in providers (Entra ID, Google, OIDC), audit
    # webhooks, and object storage on 443 (the platform bucket and tenants' own
    # S3, Azure Blob Storage, Google Cloud Storage, R2, Wasabi, B2). Any address
    # except link-local (cloud metadata service).
    # Tenants choose their own storage and SMTP servers: a tenant's store on
    # another port (for example MinIO on 9000), a syslog target (6514) or an
    # SMTP relay on port 25 needs an extra egress rule here. Opening egress
    # wider does not open the platform's network to tenants: Sendora's SSRF
    # guard still refuses loopback, private (RFC 1918, ULA), link-local, CGNAT
    # and metadata addresses for every target a tenant configures, unless a
    # platform administrator allows private targets for that tenant.
    # A platform bucket on MinIO inside the cluster needs its own rule to that
    # namespace and port; GKE workload identity needs 169.254.169.254/32 TCP 80
    # (blocked by the except below).
    # IPv6 clusters: add an ipBlock for ::/0 here and in the SMTP rule.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 443
    # SMTP submission: the platform SMTP server and tenants' own mail servers,
    # 587 (STARTTLS) and 465 (implicit TLS). Narrow the ipBlock if every tenant
    # uses the platform SMTP server.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 465
